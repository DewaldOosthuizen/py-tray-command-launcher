name: PR Gate
#
# WHAT: Single consolidated validation workflow for pull requests. Replaces the
#       former trio of ci.yml + lint.yml + tests.yml, which all ran overlapping
#       ruff/pytest checks on overlapping triggers ("**" push/PR branches),
#       tripling Actions minutes for identical coverage.
#
# WHY:  ruff-lint -> test is a real dependency chain (no point running the
#       (slow) Qt test suite against code that doesn't even pass lint), while
#       pip-audit is independent of source-code quality and runs in parallel
#       to shorten wall-clock time. pr-gate-summary is a single required
#       status check other branch-protection rules can depend on, so we don't
#       have to list three-plus flaky job names in repo settings.
#
# TRIGGER: pull_request only — deliberately NOT push to arbitrary branches.
#          The old workflows ran on every push to every branch ("**"), which
#          burned CI minutes on WIP branches with no open PR. PR-only keeps
#          Actions minutes bounded and matches an "only validate PRs" policy.
#          Push-to-main validation instead happens inside release.yml, which
#          re-validates the exact commit that lands on main (see that file's
#          header for the rationale on why validation is duplicated there).
#
# CONCURRENCY: scoped to the PR number, so pushing new commits to a PR cancels
#              the in-flight run for the previous commit instead of queuing
#              both — avoids wasted minutes on superseded code.
#
# OUT OF SCOPE: no release/build/tag/publish logic here — see release.yml.

on:
  pull_request:

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff-lint:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    name: Test suite (Qt, coverage)
    needs: ruff-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 libgl1
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  pip-audit:
    name: pip-audit (dependency vulnerability scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
      - run: pip install pip-audit
      - run: pip install -e ".[dev]"
      - run: pip-audit

  pr-gate-summary:
    name: PR gate summary
    needs: [ruff-lint, test, pip-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail loudly if any required job did not succeed
        run: |
          echo "ruff-lint: ${{ needs.ruff-lint.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "pip-audit: ${{ needs.pip-audit.result }}"
          if [ "${{ needs.ruff-lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.pip-audit.result }}" != "success" ]; then
            echo "One or more PR gate jobs failed."
            exit 1
          fi
          echo "All PR gate jobs passed."
